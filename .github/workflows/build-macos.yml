name: Build WarpCut Lite for Mac

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure universal Mac plugin
        run: |
          cmake -S WarpCutLite -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Compile plugin
        run: cmake --build build --config Release --parallel 4

      - name: Package, sign and check plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins
          VST3=$(find build -type d -name '*.vst3' -print -quit)
          AU=$(find build -type d -name '*.component' -print -quit)
          test -n "$VST3" && test -n "$AU"
          ditto "$VST3" "plugins/$(basename "$VST3")"
          ditto "$AU" "plugins/$(basename "$AU")"
          codesign --force --deep --sign - "plugins/$(basename "$VST3")"
          codesign --force --deep --sign - "plugins/$(basename "$AU")"
          codesign --verify --deep --strict --verbose=2 "plugins/$(basename "$VST3")"
          codesign --verify --deep --strict --verbose=2 "plugins/$(basename "$AU")"
          file "plugins/$(basename "$VST3")/Contents/MacOS/WarpCut Lite"
          file "plugins/$(basename "$AU")/Contents/MacOS/WarpCut Lite"
          test -x "plugins/$(basename "$VST3")/Contents/MacOS/WarpCut Lite"
          test -x "plugins/$(basename "$AU")/Contents/MacOS/WarpCut Lite"
          tar -czf WarpCutLite-Universal-Mac.tar.gz -C plugins .

      - name: Upload permission-preserving package
        uses: actions/upload-artifact@v4
        with:
          name: WarpCutLite-Fixed-Package
          path: WarpCutLite-Universal-Mac.tar.gz
          if-no-files-found: error
