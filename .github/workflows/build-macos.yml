
name: Build WarpCut Lite for Mac

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure plugin for Apple Silicon
        
        run: 
        run: 'cmake -S WarpCutLite -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'


      - name: Package plugins
        run: |
          mkdir -p plugins
          find build -name "*.vst3" -exec cp -R {} plugins/ \;
          find build -name "*.component" -exec cp -R {} plugins/ \;
          find plugins -type f -name "*.dylib" -exec file {} \;

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: WarpCutLite-AppleSilicon
          path: plugins/
          if-no-files-found: error
