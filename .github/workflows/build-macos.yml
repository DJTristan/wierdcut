
name: Build WarpCut Lite for Mac

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure universal Mac plugin
        run: |
          cmake -S WarpCutLite -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Compile plugin
        run: cmake --build build --config Release --parallel 4

      - name: Package plugins
        run: |
          mkdir -p plugins
          find build -name "*.vst3" -type d -exec cp -R {} plugins/ \;
          find build -name "*.component" -type d -exec cp -R {} plugins/ \;
          find plugins -type f -perm -111 -exec file {} \;

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: WarpCutLite-Universal-Mac
          path: plugins/
          if-no-files-found: error
